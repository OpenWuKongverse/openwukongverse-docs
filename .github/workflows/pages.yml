# OWKV Hub 门面站 · GitHub Pages 部署工作流
# 发布源：web/ 子目录（复制为站点根）→ 部署自 GitHub Actions
# 触发：push 到 main；配合 openwkv.xyz 自定义域名
name: Deploy OWKV Hub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 仅允许一个并发部署；正在进行的部署若被新 push 打断，取消旧任务
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 站点内容在 web/ 子目录；复制到 artifact 根（_site）作为发布根。
      # 纯静态，无 Jekyll 构建；禁用 Jekyll 处理以避免 _/文件被吞。
      - name: Stage web/ as site root
        shell: bash
        run: |
          mkdir -p _site
          cp -r web/. _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4